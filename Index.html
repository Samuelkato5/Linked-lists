<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Quiz: Trees, Traversals and Huffman Coding</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1c2333; --muted: #5c667a;
    --accent: #1f4e9c; --line: #dde2ee;
    --good: #1d7a46; --good-bg: #e6f5ec; --bad: #b3261e; --bad-bg: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151d; --card: #1b2030; --ink: #e8ebf3; --muted: #9aa4ba;
      --accent: #7fa8ee; --line: #2e3550;
      --good: #6fd19a; --good-bg: #17301f; --bad: #ff8c85; --bad-bg: #3a1c1b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; color: var(--accent); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5;
         display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .progress { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .count { font-size: .9rem; color: var(--muted); white-space: nowrap; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
       padding: 16px 18px; margin: 16px 0; }
  .q h2 { font-size: 1.02rem; margin: 0 0 10px; }
  .q h2 span { color: var(--accent); }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; margin: 6px 0;
         border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 4px; }
  .opt.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .locked .opt { cursor: default; }
  .expl { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
          background: color-mix(in srgb, var(--accent) 8%, transparent); font-size: .95rem; }
  .locked .expl { display: block; }
  .verdict { font-weight: 700; margin-right: 6px; }
  .verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #result { display: none; background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 18px; margin-top: 20px; }
  #result h2 { margin: 0 0 6px; color: var(--accent); }
  #result .score { font-size: 2rem; font-weight: 700; }
  #result ul { margin: 8px 0 0; padding-left: 20px; }
  #result li.active { font-weight: 700; color: var(--accent); }
  .hint { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Practice Quiz (10 Questions)</h1>
  <p class="sub">Closed notes. Choose one answer per question. One point each. Aim to finish in ten minutes.</p>

  <div class="bar">
    <div class="progress"><div id="pbar"></div></div>
    <div class="count" id="count">0 / 10 answered</div>
  </div>

  <form id="quiz" onsubmit="return false"></form>

  <div class="actions">
    <button id="submit" type="button">Submit answers</button>
    <button id="reset" type="button" class="secondary">Start over</button>
  </div>
  <p class="hint" id="hint"></p>

  <div id="result" aria-live="polite"></div>
</main>

<script>
const QUESTIONS = [
  { q: "Which set contains exactly the leaves of the album tree?",
    o: ["Trip, Japan, Tokyo", "A, B, C, D, E, F, G", "A, B, G", "D, E, F"], a: 1,
    e: "A leaf is any node with no children. In the album that is all seven photos, A to G. Trip, Japan and Tokyo are folders with children, so they are not leaves. Options C and D each list only some of the leaves." },
  { q: "Which statement about depth and height is correct?",
    o: ["The depth of a node is the number of edges from it down to its deepest leaf.",
        "Depth and height are both counted in nodes.",
        "The height of a leaf is 1.",
        "The height of the tree equals the height of its root."], a: 3,
    e: "The height of the tree is the height of its root. Option A describes height, not depth. Option B is wrong because both are counted in edges. Option C is wrong because a leaf has height 0." },
  { q: "In the album tree, what are the depth of E and the height of Japan, in that order?",
    o: ["3 and 2", "2 and 3", "3 and 3", "4 and 2"], a: 0,
    e: "E is reached by Trip, Japan, Tokyo, E: 3 edges, so its depth is 3. From Japan the longest path down is Japan, Tokyo, D: 2 edges, so its height is 2." },
  { q: "In first-child / next-sibling storage, which two links does the node Japan hold?",
    o: ["first-child Tokyo, next-sibling C", "first-child Trip, next-sibling G",
        "first-child C, next-sibling G", "first-child G, next-sibling C"], a: 2,
    e: "The first-child link points at the first child, which is C. The next-sibling link points at the next child of the same parent (Trip), which is G." },
  { q: "When the album is stored as a binary tree (first-child as left, next-sibling as right), its height grows from 3 to 8. What causes this?",
    o: ["The long row of siblings becomes a long right-hand chain.",
        "Every folder gets a second parent.",
        "The photos are moved into new folders.",
        "The left branch is removed."], a: 0,
    e: "Nothing is added or removed; the links are only reread. But a row of siblings (A, B, Japan, G) now hangs from right links, so a long row becomes a long right-hand chain, and the deepest node, F, sits 8 edges down." },
  { q: "In a binary tree, Home has left child Park and right child Market. Market has left child Stall and right child Garden. What is the inorder?",
    o: ["Home, Park, Market, Stall, Garden", "Park, Stall, Garden, Market, Home",
        "Park, Home, Stall, Market, Garden", "Garden, Stall, Market, Home, Park"], a: 2,
    e: "Inorder is left, node, right. Park comes first, then Home, then Market's left side (Stall), then Market, then Garden: Park, Home, Stall, Market, Garden. Option A is the preorder and option B is the postorder." },
  { q: "Which walk of the album tree writes A, B, C, D, E, F, Tokyo, Japan, G, Trip?",
    o: ["Preorder", "Inorder", "Level order", "Postorder"], a: 3,
    e: "Every child is written before its parent, and Trip, the root, comes last. That is postorder. Preorder would start with Trip." },
  { q: "Level order writes one depth at a time, left to right. Which structure from Class 4 holds the next depth while the current depth is being written?",
    o: ["Stack", "Queue", "Hash table", "Sorted array"], a: 1,
    e: "Level order takes nodes from the front and adds their children to the back, which is first in, first out. That is a queue." },
  { q: "A file has the labels sun ×5, sea ×2, city ×1 and night ×1. Using Huffman's rule, which joins happen, in order?",
    o: ["city + night = 2, then sea + 2 = 4, then sun + 4 = 9",
        "sun + sea = 7, then city + night = 2, then 7 + 2 = 9",
        "sea + city = 3, then night + 3 = 4, then sun + 4 = 9",
        "sun + city = 6, then sea + night = 3, then 6 + 3 = 9"], a: 0,
    e: "Always join the two smallest trees. The smallest are city 1 and night 1 (2). Then the smallest are sea 2 and the new 2 (4). Then sun 5 and the 4 (9). The other options join large trees too early." },
  { q: "With the Huffman codes sun = 0, sea = 10, city = 110 and night = 111, how many bits does the nine-label file use, and how does that compare with the fixed two-bit code?",
    o: ["9 bits, compared with 18", "18 bits, the same as the fixed code",
        "15 bits, compared with 18", "12 bits, compared with 18"], a: 2,
    e: "5×1 + 2×2 + 1×3 + 1×3 = 5 + 4 + 3 + 3 = 15 bits. The fixed code uses 9 × 2 = 18 bits." }
];

const LETTERS = ["A", "B", "C", "D"];
const form = document.getElementById("quiz");
const pbar = document.getElementById("pbar");
const count = document.getElementById("count");
const hint = document.getElementById("hint");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submit");
let locked = false;

function build() {
  form.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const box = document.createElement("section");
    box.className = "q";
    box.id = "q" + i;
    box.innerHTML = `<h2><span>Question ${i + 1}.</span> ${item.q}</h2>` +
      item.o.map((t, j) => `
        <label class="opt" data-j="${j}">
          <input type="radio" name="q${i}" value="${j}">
          <span><strong>${LETTERS[j]}.</strong> ${t}</span>
        </label>`).join("") +
      `<div class="expl"></div>`;
    form.appendChild(box);
  });
  form.querySelectorAll("input").forEach(inp => inp.addEventListener("change", onChange));
}

function onChange(e) {
  if (locked) return;
  const box = e.target.closest(".q");
  box.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
  e.target.closest(".opt").classList.add("selected");
  update();
}

function answered() {
  return QUESTIONS.filter((_, i) => form.querySelector(`input[name="q${i}"]:checked`)).length;
}

function update() {
  const n = answered();
  count.textContent = n + " / 10 answered";
  pbar.style.width = (n * 10) + "%";
  hint.textContent = "";
}

function band(score) {
  if (score >= 9) return 0;
  if (score >= 7) return 1;
  return 2;
}

submitBtn.addEventListener("click", () => {
  if (locked) return;
  const n = answered();
  if (n < 10) {
    const first = QUESTIONS.findIndex((_, i) => !form.querySelector(`input[name="q${i}"]:checked`));
    hint.textContent = `You have ${10 - n} unanswered question(s). Answer them all before submitting.`;
    document.getElementById("q" + first).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  locked = true;
  let score = 0;
  const missed = [];
  QUESTIONS.forEach((item, i) => {
    const box = document.getElementById("q" + i);
    const picked = +form.querySelector(`input[name="q${i}"]:checked`).value;
    box.classList.add("locked");
    box.querySelectorAll("input").forEach(inp => inp.disabled = true);
    box.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
    box.querySelector(`.opt[data-j="${item.a}"]`).classList.add("correct");
    const ok = picked === item.a;
    if (ok) score++;
    else {
      box.querySelector(`.opt[data-j="${picked}"]`).classList.add("wrong");
      missed.push(i + 1);
    }
    box.querySelector(".expl").innerHTML =
      `<span class="verdict ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite."}</span>` +
      `<strong>${LETTERS[item.a]}.</strong> ${item.e}`;
  });
  const b = band(score);
  const lines = [
    "9 to 10: strong. Do the preparation tasks in section 6 and you are ready for Class 6.",
    "7 to 8: good. Re-read the section for each question you missed (Q1 to Q3: section 2; Q4 to Q5: section 3; Q6 to Q8: section 4; Q9 to Q10: section 5).",
    "Below 7: go back through sections 2 to 5 slowly, redo the three checkpoints on paper, then retry the quiz."
  ];
  result.style.display = "block";
  result.innerHTML =
    `<h2>Your result</h2><div class="score">${score} / 10</div>` +
    (missed.length ? `<p>Missed: Q${missed.join(", Q")}</p>` : `<p>No questions missed.</p>`) +
    `<p><strong>Scoring and what to revise.</strong></p><ul>` +
    lines.map((t, i) => `<li class="${i === b ? "active" : ""}">${t}</li>`).join("") + `</ul>`;
  result.scrollIntoView({ behavior: "smooth", block: "start" });
  submitBtn.disabled = true;
});

document.getElementById("reset").addEventListener("click", () => {
  locked = false;
  submitBtn.disabled = false;
  result.style.display = "none";
  build();
  update();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

build();
update();
</script>
</body>
</html>
